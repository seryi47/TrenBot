# Watchlist para GitHub Actions (este archivo SÍ se sube al repo).
# NO pongas aquí el token ni el chat_id: van como "secrets" del repo.
# Para cambiar qué vigilas: edita este archivo y haz git push.
#
# Viaje de octubre: Alicante ida y vuelta, 2 personas, SOLO vuelo directo.
# Ida el 8 a partir de las 20:00 o el 9 a cualquier hora; vuelta el 11 a
# cualquier hora o el 12 aterrizando antes de las 18:00; tope 190 €/persona. Vale una sola ciudad, y la ida
# y la vuelta pueden ser de compañías distintas.
#
# poll_interval por ruta = 900 s: Ryanair y Wizz cortan (429/503) si se les
# pregunta cada minuto. adults: 2 porque en low cost el precio por persona
# sube si la tarifa barata no tiene dos asientos. max_price es el OBJETIVO;
# además se avisa de cualquier bajada de 3 € o más aunque no lo alcance.

poll_interval: 30
alert_interval: 10
mac_alerts: false
open_browser: false
watches:
- name: IDA · Alicante→Bucarest (jue 8, 21:10)
  providers:
  - wizz
  origin: ALC
  destination: OTP
  date: '2026-10-08'
  time: '21:10'
  max_price: 110
  adults: 2
  poll_interval: 900
