# Watchlist para GitHub Actions (este archivo SÍ se sube al repo).
# NO pongas aquí el token ni el chat_id: van como "secrets" del repo.
#
# VIAJE: Alicante <-> Bruselas, diciembre 2026, 1 PERSONA, SOLO vuelo directo.
#   IDA     viernes 4 o sábado 5 de diciembre
#   VUELTA  martes 8 de diciembre
#
# DOS aeropuertos, porque son dos mundos distintos:
#   CRL  Charleroi ("Bruselas Sur")  -> Ryanair. A 55 km del centro, 1 h en bus.
#   BRU  Zaventem (el de verdad)     -> Transavia, TUI fly, Vueling, Brussels
#        Airlines. Ninguna tiene API abierta, así que se leen vía Google Flights
#        con el proveedor "mercado" (navegador; ~25 s por consulta, de ahí el
#        poll_interval más alto y que no dé plazas restantes).
#
# Sin "time": se vigila el vuelo MÁS BARATO de ese día, sea de la hora que sea.
# max_price es el OBJETIVO; además avisa de cualquier bajada de 3 EUR o más.

poll_interval: 30
alert_interval: 10
mac_alerts: false
open_browser: false
watches:
- providers: &id001
  - ryanair
  adults: 1
  poll_interval: 900
  name: IDA · Alicante→Charleroi (vie 4)
  origin: ALC
  destination: CRL
  date: '2026-12-04'
  max_price: 90
- providers: *id001
  adults: 1
  poll_interval: 900
  name: IDA · Alicante→Charleroi (sáb 5)
  origin: ALC
  destination: CRL
  date: '2026-12-05'
  max_price: 90
- providers: &id002
  - mercado
  adults: 1
  poll_interval: 1800
  name: IDA · Alicante→Zaventem (vie 4)
  origin: ALC
  destination: BRU
  date: '2026-12-04'
  max_price: 110
- providers: *id002
  adults: 1
  poll_interval: 1800
  name: IDA · Alicante→Zaventem (sáb 5)
  origin: ALC
  destination: BRU
  date: '2026-12-05'
  max_price: 110
- providers: *id001
  adults: 1
  poll_interval: 900
  name: VUELTA · Charleroi→Alicante (mar 8)
  origin: CRL
  destination: ALC
  date: '2026-12-08'
  max_price: 90
- providers: *id002
  adults: 1
  poll_interval: 1800
  name: VUELTA · Zaventem→Alicante (mar 8)
  origin: BRU
  destination: ALC
  date: '2026-12-08'
  max_price: 110
