# Watchlist para GitHub Actions (este archivo SÍ se sube al repo).
# NO pongas aquí el token ni el chat_id: van como "secrets" del repo.
#
# VIAJE: Alicante <-> Bruselas, diciembre 2026, 1 PERSONA, SOLO vuelo directo.
#   IDA     viernes 4 o sábado 5 de diciembre
#   VUELTA  martes 8 de diciembre
#
# DOS aeropuertos, porque son dos mundos distintos:
#   CRL  Charleroi ("Bruselas Sur")  -> Ryanair. A 55 km del centro, 1 h en bus.
#   BRU  Zaventem (el de verdad)     -> Transavia, TUI fly, Vueling, Brussels
#        Airlines. Ninguna tiene API abierta, así que se leen vía Google Flights
#        VUELING se consulta contra SU PROPIA API (proveedor "vueling": precios
#        y plazas reales). Las otras tres siguen vía Google Flights ("mercado"),
#        que tarda ~25 s y no da plazas, de ahí el poll_interval más alto.
#
# Sin "time": se vigila el vuelo MÁS BARATO de ese día, sea de la hora que sea.
#
# SIN TOPE DE PRECIO: no hay objetivo que alcanzar ni filtro de ruido. Se avisa
# de CUALQUIER bajada de 1 EUR o más, para ir viendo cómo se mueven. Por eso no
# hay max_price y rutas.json lleva tope_por_persona en null.

poll_interval: 30
alert_interval: 10
mac_alerts: false
open_browser: false
watches:
- providers: &id001
  - ryanair
  adults: 1
  poll_interval: 900
  name: IDA · Alicante→Charleroi (vie 4)
  origin: ALC
  destination: CRL
  date: '2026-12-04'
  umbral_bajada: 1
- providers: *id001
  adults: 1
  poll_interval: 900
  name: IDA · Alicante→Charleroi (sáb 5)
  origin: ALC
  destination: CRL
  date: '2026-12-05'
  umbral_bajada: 1
- providers:
  - vueling
  - mercado
  adults: 1
  poll_interval: 1800
  name: IDA · Alicante→Zaventem (vie 4)
  origin: ALC
  destination: BRU
  date: '2026-12-04'
  umbral_bajada: 1
- providers:
  - vueling
  - mercado
  adults: 1
  poll_interval: 1800
  name: IDA · Alicante→Zaventem (sáb 5)
  origin: ALC
  destination: BRU
  date: '2026-12-05'
  umbral_bajada: 1
- providers: *id001
  adults: 1
  poll_interval: 900
  name: VUELTA · Charleroi→Alicante (mar 8)
  origin: CRL
  destination: ALC
  date: '2026-12-08'
  umbral_bajada: 1
- providers:
  - vueling
