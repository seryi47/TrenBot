name: Diagnóstico de precios

# Se lanza a mano. Corre las mismas consultas que el Mac pero desde la IP de
# GitHub, para comprobar si la aerolínea nos trata distinto según quién pregunta.
on:
  workflow_dispatch: {}

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          PYTHONUNBUFFERED: "1"
        run: python -u diagnostico.py
