name: Verificar una ruta
on:
  workflow_dispatch: {}
jobs:
  v:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests PyYAML json5 curl_cffi
      - env: {PYTHONUNBUFFERED: "1"}
        run: python -u research/_verif_tmp.py
